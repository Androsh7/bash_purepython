[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bash_purepython"
version = "0.1.2"
readme = "README.md"
description = "PurePython implementations of common bash utilities"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "build",
    "pytest",
    "ruff",
    "twine",
]

[project.scripts]
ls = "bash_purepython.ls:main"
touch = "bash_purepython.touch:main"
cat = "bash_purepython.cat:main"
cp = "bash_purepython.cp:main"
mv = "bash_purepython.mv:main"
rm = "bash_purepython.rm:main"
mkdir = "bash_purepython.mkdir:main"
rmdir = "bash_purepython.rmdir:main"
pwd = "bash_purepython.pwd:main"
echo = "bash_purepython.echo:main"
head = "bash_purepython.head:main"
tail = "bash_purepython.tail:main"
wc = "bash_purepython.wc:main"
grep = "bash_purepython.grep:main"
sort = "bash_purepython.sort:main"
uniq = "bash_purepython.uniq:main"
tr = "bash_purepython.tr:main"
cut = "bash_purepython.cut:main"
tee = "bash_purepython.tee:main"
rev = "bash_purepython.rev:main"
nl = "bash_purepython.nl:main"
basename = "bash_purepython.basename:main"
dirname = "bash_purepython.dirname:main"
realpath = "bash_purepython.realpath:main"
which = "bash_purepython.which:main"
whoami = "bash_purepython.whoami:main"
date = "bash_purepython.date:main"
env = "bash_purepython.env:main"
true = "bash_purepython.true:main"
false = "bash_purepython.false:main"
yes = "bash_purepython.yes:main"
sleep = "bash_purepython.sleep:main"
seq = "bash_purepython.seq:main"
tar = "bash_purepython.tar:main"
gzip = "bash_purepython.gzip:main"
gunzip = "bash_purepython.gunzip:main"
unzip = "bash_purepython.unzip:main"
zip = "bash_purepython.zip:main"
help = "bash_purepython.help:main"

[tool.ruff]
target-version = "py313"
line-length = 120
select = [
    "E", # Pycodestyle errors
    "F", # Pyflakes
    "I", # Isort
    "PL", # Pylint
    "UP", # Pyupgrade
]

[tool.pylint.format]
max-line-length = 120

[tool.setuptools.packages.find]
where = ["."]
include = ["bash_purepython*"]
