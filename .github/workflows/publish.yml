# Build the package and publish it to PyPI via trusted publishing.
#
# Runs on every push to main that changes VERSION.txt, alongside tag.yml, which
# creates the matching tag and GitHub Release. Neither workflow depends on the
# other. A version already on PyPI is skipped rather than failed, so re-runs
# and pushes that touch VERSION.txt without bumping it are harmless. It can
# also be run manually to publish an older tag.
#
# One-time setup per repository:
#   - Create a GitHub environment named "pypi"
#   - Register a trusted publisher on PyPI for this repository with
#     workflow "publish.yml" and environment "pypi"

name: Publish to PyPI

on:
  push:
    branches: [main]
    paths:
      - VERSION.txt
  workflow_dispatch:
    inputs:
      ref:
        description: Tag (or other ref) to build and publish, e.g. v1.4.2
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
